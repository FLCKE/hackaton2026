<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechCorp · {{ b.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">{{ b.icon }}</span>
        <div>
          <h1>TechCorp · {{ b.title }}</h1>
          <p class="subtitle">Modèle&nbsp;: <code>{{ model }}</code></p>
        </div>
      </div>
      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Vérification…</span>
      </div>
    </header>

    <div class="disclaimer">{{ b.disclaimer }}</div>

    <main class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h2>{{ b.welcome_title }}</h2>
        <p>{{ b.welcome_sub }}</p>
        <div class="suggestions">
          {% for s in b.suggestions %}
          <button class="chip">{{ s }}</button>
          {% endfor %}
        </div>
      </div>
    </main>

    <footer class="composer">
      <form id="chat-form">
        <textarea id="input" rows="1" placeholder="Écrivez votre message…" autocomplete="off"></textarea>
        <button type="submit" id="send" title="Envoyer">➤</button>
      </form>
      <button id="clear" class="clear-btn" title="Effacer la conversation">🗑️ Effacer</button>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
